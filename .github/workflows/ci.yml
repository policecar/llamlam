name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch is enough for the (network-free) test suite.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "numpy<2" "ruff==0.7.3" pytest

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Test
        # The suite is offline by design (no HuggingFace hub access).
        run: pytest -q -m "not slow"
